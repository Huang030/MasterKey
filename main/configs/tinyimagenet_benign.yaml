program: clean.py
method: grid
name: tinyimagenet_train
metric:
    name: acc
    goal: maximize
parameters:
    attacker_method:
        value: ['MasterKey']
    seed:
        value: 0
    dataset:
        value: tiny-imagenet
    num_classes:
        value: 200
    lr_method:
        values: ['fix-lr']
    lr:
        values: [0.01]
    target_lr:
        values: [0.02]
    gamma:
        values: [1]
    momentum: 
        values: [0.9]
    decay: 
        values: [0.0005]
    batch_size:
        values: [64]
    test_batch_size:
        values: [1024]
    num_worker:
        value: 8
    poison_start_epoch:
        values: 1899
    epochs:
        values: 1900
    poison_epochs:
        values: 100
    num_total_participants:
        value: 400
    num_adversaries:
        values: [1]
    num_sampled_participants:
        value: 40
    sample_method:
        values: 'fix'
    dirichlet_alpha:
        values: 0.9
    retrain_times:
        values: 2
    is_poison:
        value: false
    attacker_retrain_times:
        values: 2
    save_every:
        value: 100
    atk_model_epochs:
        value: [100]
    atk_model_lr:
        value: [0.0001]
    eps:
        value: [0.05]
    original_eps:
        value: [0.3]
    agg_method:
        values: ['avg']
    bkd_ratio:
        values: 0.5
    load_benign_model:
        values: False
    save_imgs:
        values: [False]
    eval_mode:
        values: ['random']
# random or target